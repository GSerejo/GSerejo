name: Atualiza a oficina (commits e recibo)

"on":
  schedule:
    - cron: "17 6 * * *" # todo dia, ~03:17 no horário de Brasília
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/fetch_contributions.py
      - scripts/oficina.py
      - scripts/render_printer_svg.py
      - scripts/render_receipt_svg.py
      - .github/workflows/update-profile-art.yml

permissions:
  contents: write

jobs:
  oficina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Os três scripts só usam a biblioteca padrão: nada para instalar
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_printer_svg.py
      - run: python scripts/render_receipt_svg.py

      - name: Commit das máquinas atualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json impressora-3d.svg recibo.svg
          git diff --cached --quiet || git commit -m "chore: atualiza a oficina [skip ci]"
          git push
